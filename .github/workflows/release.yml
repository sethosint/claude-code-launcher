name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (self-contained, win-x64)
        run: |
          dotnet publish Claude/ClaudeLauncher.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishReadyToRun=true `
            -o publish/ClaudeLauncher

      - name: Create release archive
        run: Compress-Archive -Path publish/ClaudeLauncher/* -DestinationPath publish/ClaudeLauncher-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeLauncher-win-x64
          path: publish/ClaudeLauncher-win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/ClaudeLauncher-win-x64.zip
          generate_release_notes: true
